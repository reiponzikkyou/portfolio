<!-- 通例のHTML宣言 -->
<!DOCTYPE html>
<!-- HTMLの始まり+言語設定 -->
<html lang="jp">
    <!-- headの中はユーザーに見えない -->
    <!-- メタデータ（文書に関するデータ）」をブラウザや検索エンジンに伝えるタグ -->
    <head>
        <!--文字エンコード これしか使わん-->
        <meta charset="UTF-8">
        <!--ビューポートの設定 これしか使わん-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--ブラウザのタブに表示される名前-->
        <title>pompom_window</title>
        <!--ページの説明 検索に載ったり、概要として表示されたり-->
        <meta name="description" content="portfolio">
        <!--外部データ(CSS)読み込み-->
        <link rel="stylesheet" href="css\style.css">
        
    </head>

    <!--bodyタグ内の要素がユーザーに表示される-->
    <body>
        <header>
            <h1>
                Portfolio site
            </h1>
        </header>
        <h1>作品紹介
            <h2>準備中...</h2>
            <h2>準備中...</h2>
            <h2>準備中...</h2>
            <h2>jujuju</h2>
        </h1>


























    </body>
</html><!-- HTMLの終わり -->
