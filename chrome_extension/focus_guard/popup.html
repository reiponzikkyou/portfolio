<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 220px; padding: 15px; font-family: sans-serif; background-color: #f9f9f9; }
    h2 { font-size: 16px; margin: 0 0 15px 0; }
    .switch-container { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
    label { font-size: 12px; color: #666; display: block; margin-top: 8px; }
    input[type="number"] { width: 100%; padding: 5px; margin-top: 3px; box-sizing: border-box; }
    .checkbox-label { display: flex; align-items: center; cursor: pointer; font-weight: bold; }
    button { width: 100%; margin-top: 15px; padding: 10px; cursor: pointer; background: #00ffcc; border: none; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Focus Guard 設定</h2>
  <div class="switch-container">
    <label class="checkbox-label">
      <input type="checkbox" id="isEnabled"> 機能を有効にする
    </label>
  </div>
  <label>開始時間（0-23時）</label>
  <input type="number" id="startHour" min="0" max="23">
  <label>終了時間（0-23時）</label>
  <input type="number" id="endHour" min="0" max="23">
  <button id="saveBtn">設定を保存</button>
  <script src="popup.js"></script>
</body>
</html>
